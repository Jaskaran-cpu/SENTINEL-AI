version: '3.8'

services:
  sentinel-ai:
    build: .
    container_name: sentinel-ai-v6
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      - SENTINEL_LOG_LEVEL=INFO
    volumes:
      - ./src:/app/src
      - ./pages:/app/pages
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
